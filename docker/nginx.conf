server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location ~ ^/(api|admin|livewire(-[a-zA-Z0-9]+)?|css/filament|js/filament|fonts/filament)(/|$) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/digital-human-api/(offer|human|interrupt_talk)$ {
        rewrite ^/digital-human-api/(.*)$ /$1 break;
        proxy_pass http://host.docker.internal:705;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 64k;
    }

    location /digital-human-api/ { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
