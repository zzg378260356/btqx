services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    working_dir: /app
    command: php artisan serve --host=0.0.0.0 --port=8000
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: btqx
      POSTGRES_USER: btqx
      POSTGRES_PASSWORD: ${BTQX_DB_PASSWORD:?Set BTQX_DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U btqx -d btqx"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped

  frontend:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "0.0.0.0:700:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
