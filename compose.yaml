services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
    restart: unless-stopped
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: btqx
      POSTGRES_USER: btqx
      POSTGRES_PASSWORD: btqx_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U btqx -d btqx"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
  frontend:
    image: node:22-bookworm-slim
    environment:
      API_PROXY_TARGET: http://backend:8000
    working_dir: /app
    command: sh -c "if [ ! -x node_modules/.bin/vite ]; then npm ci --no-audit --no-fund; fi; npm run dev -- --port 5173"
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    restart: unless-stopped
volumes:
  frontend_modules:
  postgres_data:
  redis_data:
